<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Inicio de sesión para el inventario de Mi Pulpería." />
    <title>Iniciar sesión | Mi Pulpería</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="brand" href="/" aria-label="Mi Pulpería">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>mi pulpería<small>control de inventario</small></span>
      </a>
      <p class="eyebrow">ACCESO PRIVADO</p>
      <h1>Iniciar sesión</h1>
      <p class="welcome-copy">Ingrese la contraseña de acceso para administrar el inventario.</p>
      <form id="login-form">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button class="button button-primary" type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
